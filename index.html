<body>
  <script>
    // Apply the saved theme before first paint (D4). Failure keeps the system theme.
    try {
      var savedTheme = localStorage.getItem('eway-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (error) {}
  </script>
  <noscript>Для роботи NEXTCOM увімкніть JavaScript.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
